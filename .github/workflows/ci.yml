name: CI

# 轻量流水线（2026-09-26 审计 P2-G：仓库此前完全没有 CI，验收脚本全靠手跑）：
# typecheck -> lint -> 依赖安全门禁（audit-gate）-> 单元测试 -> electron-vite build。
# 另一条 job（package-smoke，2026-10-15 审查 P0-3）做 --dir 打包 + 打包态原生模块冒烟，
# 挡住 ABI / asar 依赖收集这类只在打包态暴露的问题。
# 重活（完整 NSIS 安装包、真机 CDP 验收套件）留在 tools/acceptance/run-acceptance.ps1，
# 需要 Windows 桌面环境，不适合托管 runner。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    # Windows：主进程产物、better-sqlite3 预编译包与打包脚本都以 Windows x64 为目标
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager（pnpm@10.34.7）锁定——本机与 CI 强制一致
        # （2026-10-15 审查：本机曾用的 pnpm 12.3.4 存在"install 成功但不建链接"的系统级问题）
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + lint + audit gate + unit tests + build)
        shell: pwsh
        run: ./tools/ci/verify.ps1

  package-smoke:
    # 打包态冒烟（审查 P0-3）：--dir 打包 + 用 Electron 运行时装载打包后的 better-sqlite3。
    # 不跑安装包（NSIS 在 verify 之外由发布流程产出），不需要桌面环境。
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 锁定（同上）
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package (--dir) + packaged native smoke
        shell: pwsh
        run: ./tools/ci/package-smoke.ps1
