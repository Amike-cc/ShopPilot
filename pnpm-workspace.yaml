packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  # better-sqlite3 v13 自带 prebuildify 预编译（prebuilds/win32-x64.node 等，N-API，Node/Electron 共用），
  # lib/binding.js 运行时优先加载 prebuilds；binding.gyp 也内建「有 prebuilds 即跳过编译」。
  # 允许 pnpm 跑隐式 node-gyp rebuild 只会逼每台机器先通过 VS 探测——CI 与无 VS 的机器直接 install 失败
  # （2026-10-15 CI 实测：runner 上 find VS 崩溃导致两个 job 全挂），且编译产物根本不会被加载。
  # 显式 false = 已知并豁免，与 electron-winstaller 同一处置。
  better-sqlite3: false
  electron: true
  # electron-winstaller 是 electron-builder 的 Squirrel.Windows 目标依赖；本项目只出 NSIS
  # 安装包，不需要它的 install 脚本（挑选 7z 架构）。显式 false = 已知并豁免，
  # 避免 pnpm 每次 install 都以 "Ignored build scripts" 报错（2026-10-15 实测）。
  electron-winstaller: false
  esbuild: true
  vue-demi: true
# 依赖安全覆盖写在根 package.json 的 pnpm.overrides 中：pnpm 10.34 会把它们写入
# pnpm-lock.yaml 并在安装时真正重解析；仅写在 workspace 配置时旧锁文件可能被错误地
# 判定为 up to date，导致已修复版本没有落到安装目录。
minimumReleaseAgeExclude:
  - electron-vite@6.0.0

# electron-builder 打包时是**按 node_modules 文件系统扁平化收集**生产依赖的（electron-builder 24
# 时代实测：即使 pnpm-lock.yaml 已全树解析为 9.7.0，它仍从 node_modules 根目录那份实体目录抄走了
# 旧版本）。显式让 pnpm 把 builder-util-runtime 公开提升到根目录并保持与 package overrides 一致；
# 打包态由 tools/ci/packaged-native-smoke.js（与人工解包抽查）兜底验证。
publicHoistPattern:
  - builder-util-runtime
